services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: toscana_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toscana_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
