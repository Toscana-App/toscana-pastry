[project]
name = "pdfgenerator"
version = "0.1.0"
description = "Binario de render de PDF (PyMuPDF + ReportLab + WeasyPrint) para Toscana Pastry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "reportlab>=5.1,<6",
    "weasyprint>=62",
]

[project.scripts]
pdfgenerator = "pdfgenerator.server:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfgenerator"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
