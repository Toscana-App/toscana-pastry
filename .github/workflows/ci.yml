name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The local npm 10.9.x crashes (arborist) resolving canvas, an optional
      # dep of jsdom, in this repo. Documented workaround: latest npm.
      - name: Install dependencies
        run: npx -y npm@latest ci

      - name: Lint
        run: npx eslint src

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/toscana_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: toscana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toscana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # System libraries required by WeasyPrint (PDF rendering in the API
      # tests) plus fonts so rendered PDF text is not empty.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libpangocairo-1.0-0 \
            libcairo2 libgdk-pixbuf-2.0-0 libffi-dev \
            fonts-liberation fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --quiet uv

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Run tests
        # TEMP-DIAGNOSTIC (revertir): solo 3 tests con traceback completo.
        run: uv run pytest --tb=long -k "weekly_default_week_aggregates or orders_export_csv_default or budgets_export_csv_default"
